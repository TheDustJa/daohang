name: nav-prod

services:
  backend:
    image: nav-backend:release
    container_name: nav-backend
    restart: unless-stopped
    environment:
      NAV_ADMIN_USERNAME: ${NAV_ADMIN_USERNAME}
      NAV_ADMIN_PASSWORD: ${NAV_ADMIN_PASSWORD}
      NAV_SECRET_KEY: ${NAV_SECRET_KEY}
    volumes:
      - /home/daohang/data:/app/data
    expose:
      - "8000"

  frontend:
    image: nav-frontend:release
    container_name: nav-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-18080}:80"
