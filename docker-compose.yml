name: nav-stack

services:
  backend:
    build:
      context: ./pybackground
    container_name: nav-backend
    restart: unless-stopped
    environment:
      NAV_ADMIN_USERNAME: admin
      NAV_ADMIN_PASSWORD: admin123
      NAV_SECRET_KEY: change-this-secret-key
    volumes:
      - ./pybackground/data:/app/data
    ports:
      - "18000:8000"

  frontend:
    build:
      context: ./web
    container_name: nav-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
